[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vmbdiet"
version = "0.1.0"
description = "Diet ↔ vaginal microbiome association toolkit: community state types (CST) + nutrient/food associations with BV and Lactobacillus dominance"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Jean Yu" }]
keywords = ["vaginal microbiome", "diet", "nutrition", "bacterial vaginosis", "CST",
            "community state type", "VALENCIA", "Lactobacillus", "16S"]
dependencies = ["pandas>=1.3", "numpy>=1.20", "scipy>=1.7", "statsmodels>=0.13"]

[project.optional-dependencies]
plot = ["matplotlib>=3.4"]
test = ["pytest>=7"]

[project.scripts]
vmbdiet = "vmbdiet.cli:main"

[tool.setuptools]
packages = ["vmbdiet"]

[tool.setuptools.package-data]
vmbdiet = ["data/*.csv"]
